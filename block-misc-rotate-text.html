<html dir="ltr" lang="en-US">
<head>
<meta content="text/html; charset=utf-8" http-equiv="content-type"/>
<meta content="SemiColonWeb" name="author"/>
<!--样式表 =============================================-->
<link href="https://fonts.googleapis.com/css?family=Lato:300,400,400i,700|Poppins:300,400,500,600,700|PT+Serif:400,400i&amp;display=swap" rel="stylesheet" type="text/css"/>

<!--文件标题 =============================================-->
<title>在 Canvas 上旋转</title>
<style>

		.center-text {
			position: absolute;
			top: 50%;
			left: 50%;
			transform: translate(-50%, -50%);
		}
	</style>
</head>
<body class="stretched">
<!--文档折叠器 =============================================-->
<div class="clearfix" id="wrapper">
<!--内容 =============================================-->
<section id="content">
<div class="content-wrap bg-light overflow-visible">
<div class="container clearfix">
<div class="min-vh-25"></div>
<h3>滚动效果旋转圆形文本</h3>
<div class="circular-text position-fixed" style="min-width: 300px; max-height: 300px; top: 20px; right: 20px;">
<div>
<h4 class="parallax m-0" data-0="transform: rotate(0deg);" data-end="transform: rotate(360deg);" id="rotated-text">公司 投资组合 企业 房地产 医疗 建筑</h4>
<h2 class="center-text mb-0">演示词</h2>
</div>
</div>
<div style="height: 1000px;"></div>
</div>
</div>
</section><!--内容结束-->
</div><!--# 包装结束 #-->
<!--转到 顶 =============================================-->
<div class="icon-angle-up" id="gotoTop"></div>
<!--Java 脚本 =============================================-->
<script src="js/jquery.js"></script>
<script src="js/plugins.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/circletype@2.3.0/dist/circletype.min.js"></script>
<!--页脚本 =============================================-->
<script src="js/functions.js"></script>
<script>
		const circleType = new CircleType(
			document.getElementById("rotated-text")
			).radius(80);
	</script>
</body>
