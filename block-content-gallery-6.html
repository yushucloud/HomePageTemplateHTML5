<html dir="ltr" lang="en-US">
<head>
<meta content="text/html; charset=utf-8" http-equiv="content-type"/>
<meta content="SemiColonWeb" name="author"/>
<!--样式表 =============================================-->
<link href="https://fonts.googleapis.com/css?family=Lato:300,400,400i,700|Poppins:300,400,500,600,700|PT+Serif:400,400i&amp;display=swap" rel="stylesheet" type="text/css"/>
<link href="css/bootstrap.css" rel="stylesheet" type="text/css"/>
<link href="style.css" rel="stylesheet" type="text/css"/>
<link href="css/dark.css" rel="stylesheet" type="text/css"/>

<link href="css/font-icons.css" rel="stylesheet" type="text/css"/>
<link href="css/animate.css" rel="stylesheet" type="text/css"/>
<link href="css/magnific-popup.css" rel="stylesheet" type="text/css"/>
<link href="css/custom.css" rel="stylesheet" type="text/css"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<!--文件标题 =============================================-->
<title>图片库 QQ Canvas</title>
</head>
<body class="stretched">
<!--文档折叠器 =============================================-->
<div class="clearfix" id="wrapper">
<!--内容 =============================================-->
<section id="content">
<div class="content-wrap">
<div class="container clearfix">
<div class="row justify-content-center mb-6">
<div class="col-xl-6 col-lg-8 text-center">
<h3 class="h1 fw-bold mb-4">相册</h3>
<p>Lorem evenum dolor sit amet, concessetur adipiscing, elit. 洛伦特·德洛尔坐着相机, 口腔摄取, 被放出。 Necessitatibus harum quis 建筑师 libero sint 准 simique illo sesse quia macit querat, magni nam, dolore odit at quisquam, not unde laudantium? 意思是说,你对这个名字有印象吗?</p>
</div>
</div>
<div class="clear"></div>
<div class="row align-items-stretch text-center dark mx-0">
<div class="col-md-6 videoplay-on-hover overflow-hidden rounded-3 mb-3 mb-md-0" style="min-height: 500px;">
<div class="vertical-middle text-center">
<h3 class="mb-0 ls1 font-body h2">在 Hover 上播放视频</h3>
</div>
<div class="video-wrap position-absolute w-100 h-100 rounded-3 mx-md-3" style="top: 0; left:0;">
<video id="slide-video" loop="" muted="" poster="one-page/images/videos/1.jpg" preload="auto">
<source src="one-page/images/videos/1.webm" type="video/webm"/>
<source src="one-page/images/videos/1.mp4" type="video/mp4"/>
</video>
<div class="video-overlay" style="background: rgba(0,0,0,0.2);"></div>
</div>
</div>
<div class="col-md-6 overflow-hidden rounded-3" style="min-height: 500px;">
<div class="vertical-middle text-center">
<h3 class="mb-0 ls1 font-body h2">装入时播放视频</h3>
</div>
<div class="video-wrap position-absolute w-100 h-100 rounded-3 mx-md-3" style="top: 0; left:0;">
<video autoplay="" id="slide-video" loop="" muted="" poster="one-page/images/videos/3.jpg" preload="auto">
<source src="one-page/images/videos/3.webm" type="video/webm"/>
<source src="one-page/images/videos/3.mp4" type="video/mp4"/>
</video>
<div class="video-overlay" style="background: rgba(0,0,0,0.3);"></div>
</div>
</div>
</div>
</div>
</div>
</section><!--内容结束-->
</div><!--# 包装结束 #-->
<!--转到 顶 =============================================-->
<div class="icon-angle-up" id="gotoTop"></div>
<!--Java 脚本 =============================================-->
<script src="js/jquery.js"></script>
<script src="js/plugins.min.js"></script>
<!--页脚本 =============================================-->
<script src="js/functions.js"></script>
<script>

		jQuery(document).ready(function($){
			$('.videoplay-on-hover').hover( function(){
				if( $(this).find('video').length > 0 ) {
					$(this).find('video').get(0).play();
				}
			}, function(){
				if( $(this).find('video').length > 0 ) {
					$(this).find('video').get(0).pause();
				}
			});
		});

	</script>
</body>
</html>
