<title>旋转文本 QQ Canvas</title>
<style>

		.center-text {
			position: absolute;
			top: 50%;
			left: 50%;
			transform: translate(-50%, -50%);
		}

		@-webkit-keyframes rotating /* Safari and Chrome */ {
		  from {
		    -webkit-transform: rotate(0deg);
		    -o-transform: rotate(0deg);
		    transform: rotate(0deg);
		  }
		  to {
		    -webkit-transform: rotate(360deg);
		    -o-transform: rotate(360deg);
		    transform: rotate(360deg);
		  }
		}
		@keyframes rotating {
		  from {
		    -ms-transform: rotate(0deg);
		    -moz-transform: rotate(0deg);
		    -webkit-transform: rotate(0deg);
		    -o-transform: rotate(0deg);
		    transform: rotate(0deg);
		  }
		  to {
		    -ms-transform: rotate(360deg);
		    -moz-transform: rotate(360deg);
		    -webkit-transform: rotate(360deg);
		    -o-transform: rotate(360deg);
		    transform: rotate(360deg);
		  }
		}
		.rotating {
		  -webkit-animation: rotating 20s linear infinite;
		  -moz-animation: rotating 20s linear infinite;
		  -ms-animation: rotating 20s linear infinite;
		  -o-animation: rotating 20s linear infinite;
		  animation: rotating 20s linear infinite;
		}
	</style>
</head>
<body class="stretched">
<!--文档折叠器 =============================================-->
<div class="clearfix" id="wrapper">
<!--内容 =============================================-->
<section id="content">
<div class="content-wrap">
<div class="container center clearfix">
<h3>旋转循环文字</h3>
<div class="circular-text position-relative">
<h4 class="m-0 rotating infinite" id="rotated-text">电话:+00 11 222 333 QQ 电子邮件: no-reply@canvas.com</h4>
<a class="center-text fw-bold h2 text-dark" href="#">24x7 (简体中文).</a>
</div>
</div>
</div>
</section><!--内容结束-->
