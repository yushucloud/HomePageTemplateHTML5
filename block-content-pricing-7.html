<!--文件标题 =============================================-->
<title>彩色画作</title>
<style>

		.pricing-tabs input.switch-toggle-round:checked + label::before {
			background-color: #007bff
		}

		.pricing-tabs label.active {
			background-color: #007bff;
		}

		.pricing-tabs label.active * {
			color: #FFF;
		}

		.pricing-tabs .price small {
			font-size: 12px;
			opacity: .7;
		}

		.pricing-tabs .price-discount {
			position: relative;
			top: -12px;
			margin-left: 10px;
			background: url('demos/seo/images/icons/discount.svg') no-repeat 0 0;
			width: 60px;
			height: 39px;
		}
	</style>

<body class="stretched">
<!--文档折叠器 =============================================-->
<div class="clearfix" id="wrapper">
<!--内容 =============================================-->
<section id="content">
<div class="content-wrap">
<div class="container clearfix">
<h3 class="text-center mb-6">定价切换器</h3>
<div class="row gutter-50 justify-content-center">
<!--标签链接 =============================================-->
<div class="pricing-tabs col-xl-5 col-lg-6 col-md-7" id="pricing-switch">
<div class="pricing-tenure-switcher row align-items-center justify-content-center mb-4" data-container="#pricing-switch">
<span class="pts-left col-auto">每月</span>
<div class="pts-switcher col-auto">
<div class="switch">
<input class="switch-toggle switch-toggle-round" id="switch-toggle-pricing-tenure" type="checkbox"/>
<label class="mb-0" for="switch-toggle-pricing-tenure"></label>
</div>
</div>
<span class="pts-right col-auto">每年</span>
<div class="price-discount"></div>
</div>
<!--标签 1-->
<label class="d-flex align-items-center border rounded p-3 ls0 mb-2 nott active" for="pricing-plan-nav-basic">
<input checked="" id="pricing-plan-nav-basic" name="pricing-plan-nav" type="radio" value="Basic"/>
<div class="mx-3 pe-2 pe-lg-3">
<h4 class="mb-0 fw-semibold">基础</h4>
<p class="mb-0 fw-normal text-smaller">30天免费拖车</p>
</div>
<div class="ms-auto">
<div class="pts-switch-content-left"><h3 class="mb-0 price">免费</h3></div>
<div class="pts-switch-content-right d-none"><h3 class="mb-0 price">免费</h3></div>
</div>
</label>
<!--标签 2-->
<label class="d-flex align-items-center border rounded p-3 ls0 mb-2 nott" for="pricing-plan-nav-professional">
<input id="pricing-plan-nav-professional" name="pricing-plan-nav" type="radio" value="Professional"/>
<div class="mx-3 pe-2 pe-lg-3">
<h4 class="mb-0 fw-semibold">专业人员</h4>
<p class="mb-0 fw-normal text-smaller">1名用户,1名网站许可证</p>
</div>
<div class="ms-auto">
<div class="pts-switch-content-left"><h3 class="mb-0 price">$19 <small>月数</small></h3></div>
<div class="pts-switch-content-right d-none"><h3 class="mb-0 price">$182 <small>每年</small></h3></div>
</div>
</label>
<!--标签 3-->
<label class="d-flex align-items-center border rounded p-3 ls0 mb-2 nott" for="pricing-plan-nav-business">
<input id="pricing-plan-nav-business" name="pricing-plan-nav" type="radio" value="Business"/>
<div class="mx-3 pe-2 pe-lg-3">
<h4 class="mb-0 fw-semibold">商业</h4>
<p class="mb-0 fw-normal text-smaller">对于 10 个用户, 无限网站许可</p>
</div>
<div class="ms-auto">
<div class="pts-switch-content-left"><h3 class="mb-0 price">$29 <small>月数</small></h3></div>
<div class="pts-switch-content-right d-none"><h3 class="mb-0 price">$278 <small>每年</small></h3></div>
</div>
</label>
</div>
<div class="col-xl-5 col-lg-5 col-md-5">
<h3>选择您的计划</h3>

</div>
</div>
</div>
</div>
</section><!--内容结束-->

<script src="js/jquery.js"></script>
<script src="js/plugins.min.js"></script>
<!--页脚本 =============================================-->
<script src="js/functions.js"></script>
<script>
		$('input[name="pricing-plan-nav"]').click(function (e) {
			$(this).removeClass('active');
			$('.pricing-tabs label.active').removeClass('active');
			$(this).parent('label').addClass('active');
		});
	</script>
</body>
</html>
