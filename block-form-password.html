(简体中文)
<html dir="ltr" lang="en-US">
<head>
<meta content="text/html; charset=utf-8" http-equiv="content-type"/>
<meta content="SemiColonWeb" name="author"/>
<!--样式表 =============================================-->
<link href="https://fonts.googleapis.com/css?family=Lato:300,400,400i,700|Poppins:300,400,500,600,700|PT+Serif:400,400i&amp;display=swap" rel="stylesheet" type="text/css"/>
<link href="css/bootstrap.css" rel="stylesheet" type="text/css"/>
<link href="style.css" rel="stylesheet" type="text/css"/>
<link href="css/dark.css" rel="stylesheet" type="text/css"/>
<link href="css/font-icons.css" rel="stylesheet" type="text/css"/>
<link href="css/animate.css" rel="stylesheet" type="text/css"/>
<link href="css/magnific-popup.css" rel="stylesheet" type="text/css"/>
<link href="css/custom.css" rel="stylesheet" type="text/css"/>
<meta content="width=device-width, initial-scale=1" name="viewport"/>
<!--文件标题 =============================================-->
<title>显示/隐藏密码 QQ Canvas</title>
</head>
<body class="stretched">
<!--文档折叠器 =============================================-->
<div class="clearfix" id="wrapper">
<!--内容 =============================================-->
<section id="content">
<div class="content-wrap">
<div class="container">
<div class="row justify-content-center">
<div class="col-md-4">
<form class="row mb-0">
<div class="col-12 text-center">
<h3>显示/ 隐藏密码</h3>
</div>
<div class="col-12">
<label for="form-password">密码 :</label>
<div class="input-group toggle-password">
<input class="form-control" type="password" value="12345678"/>
<button class="btn btn-outline-secondary icon-line-eye btn-password-toggle" style="border-color: #ced4da" type="button"></button>
</div>
</div>
<div class="col-12 mt-5">
<label for="form-password">密码 :</label>
<div class="input-group toggle-password" data-icon-off="icon-line-unlock" data-icon-on="icon-line-lock">
<input class="form-control border-end-0" type="password" value="12345678"/>
<button class="btn border-start-0 btn-outline-secondary icon-line-lock btn-password-toggle" style="border-color: #ced4da" type="button"></button>
</div>
</div>
</form>
</div>
</div>
</div>
</div>
</section><!--内容结束-->
</div><!--# 包装结束 #-->
<!--转到 顶 =============================================-->
<div class="icon-angle-up" id="gotoTop"></div>
<!--Java 脚本 =============================================-->
<script src="js/jquery.js"></script>
<script src="js/plugins.min.js"></script>
<!--页脚本 =============================================-->
<script src="js/functions.js"></script>
<script>
		let elem = $(".toggle-password");

		elem.each( function(){
			let el = $(this),
				btn = el.find(".btn-password-toggle"),
				iconOn = el.attr('data-icon-on') || 'icon-line-eye',
				iconOff = el.attr('data-icon-off') || 'icon-line-eye-off',
				input = el.find('input');

			btn.off( 'click' ).on( 'click', function(){
				if (input.attr('type') === "password") {
					input.attr('type', 'text');
					btn.removeClass(iconOn).addClass(iconOff);
				} else {
					input.attr('type', 'password');
					btn.removeClass(iconOff).addClass(iconOn);
				}

				return false;
			});
		});
	</script>
</body>
</html>
