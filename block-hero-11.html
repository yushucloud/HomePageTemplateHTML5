<title>英雄们,</title>
<style>
		.block-hero-11 h1,
		.block-hero-11 h2,
		.block-hero-11 h3,
		.block-hero-11 h4,
		.block-hero-11 h5,
		.block-hero-11 h6 { font-family: Playfair Display, serif !important; color: #045d63 }

		body.block-hero-11,
		.block-hero-11 p { font-family: Roboto, sans-serif !important; }

		/* <a href="https://www.jqueryscript.net/animation/">Animation</a> */
		@-webkit-keyframes
			pulsate {  0% {
				-webkit-transform: scale(1);
				transform: scale(1);
				opacity: 0.8;
			}
			 45% {
				-webkit-transform: scale(1.75);
				transform: scale(1.75);
				opacity: 0;
			}
		}
		@keyframes
			pulsate {  0% {
				-webkit-transform: scale(1);
				transform: scale(1);
				opacity: 0.8;
			}
				45% {
				-webkit-transform: scale(1.75);
				transform: scale(1.75);
				opacity: 0;
			}
		}

		/* Hotspot */
		.block-hero-11 .hotspot-img {
			background-size: cover;
			background-position: center center;
			position: relative;
		}

		.block-hero-11 .hotspot-img .img-responsive { max-width: 100%; }

		.block-hero-11 .hotspot-img .hot-spot {
			position: absolute;
			width: 26px;
			height: 26px;
			top: 5px;
			left: 5px;
			text-align: center;
			background-color: #000;
			color: #FFF;
			border-radius: 100%;
			cursor: pointer;
			font-size: 12px;
			line-height: 26px;
			transition: all .3s ease;
		}

		.block-hero-11 .hotspot-img .hot-spot .circle {
			z-index: 2;
			position: relative;
		}

		.block-hero-11 .hotspot-img .hot-spot .circle i {
			-webkit-transition: -webkit-transform .25s ease-out;
			transition: transform .25s ease-out;
		}

		.block-hero-11 .hotspot-img .hot-spot.hotspot-tooltip-open .circle i,
		.block-hero-11 .hotspot-img .hot-spot:not(.hotspot-on-click):hover .circle i {
			-webkit-transform: rotate(45deg);
			transform: rotate(45deg);
		}

		.block-hero-11 .hotspot-img .hot-spot .circle:after {
			content: '';
			display: block;
			position: absolute;
			top: 39%;
			left: 39%;
			width: 30px;
			height: 30px;
			margin: -1em auto auto -1em;
			-webkit-transform-origin: 50% 50%;
			transform-origin: 50% 50%;
			border-radius: 50%;
			border: 10px solid #000;
			opacity: 0;
			-webkit-animation: pulsate 3s ease-out infinite;
			animation: pulsate 3s ease-out infinite;
		}

		.block-hero-11 .hotspot-img .hot-spot .tooltip {
			display: none;
			background-color: rgba(255, 255, 255, 0.96);
			-webkit-border-radius: 3px;
			-moz-border-radius: 3px;
			border-radius: 3px;
			font-size: 14px;
			opacity: 1.0;
			left: 0;
			padding: 15px;
			position: absolute;
			top: 35px;
			width: 280px;
			z-index: 999;
			box-shadow: 0 30px 102px rgba(0,0,0,0.33), 0 20px 51px rgba(0,0,0,0.18);
		}

		.block-hero-11 .hotspot-img .hot-spot .tooltip.ontop {
			top: auto;
			bottom: 35px;
		}

		.block-hero-11 .hotspot-img .hot-spot .tooltip .img-row {
			margin-bottom: 10px;
			display: block;
		}
		.block-hero-11 .hotspot-img .hot-spot .tooltip h4 { margin-bottom: 0; }

		.block-hero-11 .hotspot-img .hot-spot .tooltip p {
			font-size: 13px;
			line-height: 1.3rem !important;
			margin-bottom: 10px;
			color: #666 !important;
		}

		.block-hero-11 .hotspot-img .hot-spot .tooltip p:last-child { margin-bottom: 0; }

		@media (max-width: 991px) {
			.block-hero-11 .hotspot-img .hot-spot .tooltip {
				width: 200px;
				left: 30px;
				top: 35px;
			}

			.block-hero-11 .hotspot-img .hot-spot .tooltip .img-row {
				display: none;
			}
		}

		@media (min-width: 992px) {

			.block-hero-11 .slider-element > .container {
				position: absolute;
				top: 0;
				left: 0;
				right: 0;
				height: 100%;
			}
		}

	</style>
</head>
