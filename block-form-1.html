<!--文件标题 =============================================-->
<title>表格 \\ 相机</title>
<style>
		.block-form-1 .form-group {
			position: relative;
			margin-bottom: 1rem;
		}

		.block-form-1 .form-group label:not(.error) {
			position: absolute;
			top: 50%;
			left: 10px;
			margin-bottom: 0; /* Override default `<label>` margin */
			color: #BBB;
			padding: 0 4px;
			transform: translateY(-50%);
			transition: all 200ms ease;
			cursor: text;
			text-transform: none;
			letter-spacing: 0;
			font-weight: 500;
		}

		.block-form-1 .form-group input:focus + label:not(.error),
		.block-form-1 .form-group input.focus-visible + label:not(.error),
		.block-form-1 .form-group input:visited + label:not(.error),
		.block-form-1 .form-group input:not(:placeholder-shown) + label:not(.error) {
		  font-size: 70%;
		  transform: translate3d(0, -50%, 0);
		  top: 0;
		  color: #999;
		  background-color: #FFF;
		}

		.block-form-1 .form-group input::-webkit-input-placeholder {
			opacity: 0;
		}
		.block-form-1 .form-group input:-ms-input-placeholder {
			opacity: 0;
		}
		.block-form-1 .form-group input::-moz-placeholder {
			opacity: 0;
		}

		.block-form-1 .form-control.border-bottom {
			border-left: 0;
			border-top: 0;
			border-right: 0;
		}

		.block-form-1 .form-control.border-bottom + label:not(.error) {
			left: 0;
			color: #BBb !important;
		}
	</style>
</head>
<body class="stretched">
<!--文档折叠器 =============================================-->
<div class="clearfix" id="wrapper">
<!--内容 =============================================-->
<section id="content">
<div class="content-wrap">
<div class="container">
<div class="row justify-content-around">
<div class="col-md-4">
<form action="#" autocomplete="off" class="row g-0 form-signin block-form-1" method="post" name="login-form">
<div class="col-12 text-center">
<h3>动画标签</h3>
</div>
<div class="col-12 form-group">
<input class="form-control" id="form-username" placeholder="Username" type="text"/>
<label for="form-username">用户名 :</label>
</div>
<div class="col-12 form-group">
<input autocomplete="new-password" class="form-control" id="form-password" placeholder="Username" type="password"/>
<label for="form-password">密码 :</label>
</div>
<div class="col-12 form-group text-center">
<button class="btn btn-primary w-100 mb-3">登录</button>
<h6 class="fw-medium">没有帐户吗?<a href="#"><u>注册</u></a></h6>
</div>
</form>
</div>
<div class="col-md-4">
<form action="#" autocomplete="off" class="row g-0 form-signin block-form-1" method="post" name="login-form">
<div class="col-12 text-center">
<h3>行动画标签</h3>
</div>
<div class="col-12 form-group">
<input class="form-control border-bottom px-1 rounded-0" id="border-form-username" placeholder="Username" type="text"/>
<label for="border-form-username">用户名 :</label>
</div>
<div class="col-12 form-group">
<input autocomplete="new-password" class="form-control border-bottom px-1 rounded-0" id="border-form-password" placeholder="Username" type="password"/>
<label for="border-form-password">密码 :</label>
</div>
<div class="col-12 form-group text-center">
<button class="btn btn-primary w-100 mb-3">登录</button>
<h6 class="fw-medium">没有帐户吗?<a href="#"><u>注册</u></a></h6>
</div>
</form>
</div>
</div>
</div>
</div>
</section><!--内容结束-->
</div><!--# 包装结束 #-->
