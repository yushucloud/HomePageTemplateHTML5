<!--文件标题 =============================================-->
<title>英雄分裂 QQ Canvas</title>
<style>

		.section-split h1,
		.section-split h2,
		.section-split h3 { font-family: Playfair Display, serif !important; }

		@media (min-width: 576px) {
			.section-split {
				--section-width: 50%;
				--hover-width: 65%;
				--less-width: calc(100% - var(--hover-width));
				--hover-speed: 1s;
				--bg-opacity: 0.7;

				position: absolute;
				left: 0;
				top: 0;
				width: var(--section-width);
				background-repeat: no-repeat;
	  			background-size: auto 100%;
	  			background-position: center center;
				transition: width var(--hover-speed) ease;
			}

			.section-split.split-right {
				left: auto;
				right: 0;
			}

			.section-split:hover ~ .section-split {
				width: var(--less-width);
			}

			.section-split:hover {
				width: var(--hover-width);
			}
		}


	</style>
</head>
<body class="stretched">

<div class="clearfix" id="wrapper">
<!--内容 =============================================-->
<section id="content">
<div class="content-wrap min-vh-100 py-0">
